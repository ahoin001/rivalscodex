name: Sync Heroes Data

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run sync without promoting heroes.json"
        required: false
        default: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync heroes
        env:
          NEXT_PUBLIC_ENABLE_EXTERNAL_APIS: "true"
          NEXT_PUBLIC_PREFER_API_CONTENT: "true"
          NEXT_PUBLIC_ALLOW_IMAGE_RECACHE: "false"
          MARVEL_RIVALS_API_BASE_URL: ${{ vars.MARVEL_RIVALS_API_BASE_URL }}
          MARVEL_RIVALS_API_KEY: ${{ secrets.MARVEL_RIVALS_API_KEY }}
          MARVEL_RIVALS_TIMEOUT_MS: "8000"
          MARVEL_RIVALS_RETRY_COUNT: "1"
          MARVEL_RIVALS_CACHE_TTL_SECONDS: "3600"
          SYNC_HERO_COUNT_DELTA_RATIO: "0.35"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            npm run sync:heroes
          else
            npm run sync:heroes:dry-run
          fi
