name: Release and production deploy

# Manual run: Actions → Release and production deploy → Run workflow → pick patch / minor / major.
#
# Secrets (optional):
#   RELEASE_GITHUB_TOKEN — not used by default; add `token: ${{ secrets.RELEASE_GITHUB_TOKEN }}`
#     to the checkout step if the default GITHUB_TOKEN cannot push (branch rulesets).
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID — enable `vercel deploy --prod` after version bump + push.
#
# Vars (optional): none required for this workflow.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump for package.json + git tag"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Release (commit if needed, version bump, push, optional Vercel)
        env:
          COMMIT_MESSAGE: "chore: sync before release [skip ci]"
          RELEASE_BRANCH: ${{ github.ref_name }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/release.mjs --${{ inputs.bump }}
